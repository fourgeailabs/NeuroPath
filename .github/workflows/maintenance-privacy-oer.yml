name: Maintenance - privacy and OER jurisdiction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply focused source fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt')
          s = p.read_text()
          old = '''                    country = profile.country\n                )'''
          new = '''                    country = profile.country,\n                    stateOrProvince = profile.stateOrProvince\n                )'''
          if old not in s:
              raise SystemExit('Expected OER tutor context call was not found')
          s = s.replace(old, new, 1)
          old_privacy = '                        Learner profile accommodation considerations: ${profile.neurodivergentTypesCsv}.\n'
          if old_privacy not in s:
              raise SystemExit('Raw diagnosis prompt line was not found')
          s = s.replace(old_privacy, '                        Learner accommodation and accessibility signals: use the privacy-safe personalization profile above; do not request or infer diagnosis labels.\n', 1)
          p.write_text(s)
      - name: Verify focused fixes
        shell: bash
        run: |
          ! grep -n 'profile.neurodivergentTypesCsv' app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          grep -n 'stateOrProvince = profile.stateOrProvince' app/src/main/java/com/example/ui/NeuroPathViewModel.kt
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          git commit -m 'fix: keep cloud tutoring diagnosis-safe and region-aware'
          git push
      - name: Remove maintenance workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/maintenance-privacy-oer.yml
          git commit -m 'chore: remove one-time maintenance workflow'
          git push
