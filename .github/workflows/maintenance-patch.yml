name: One-time NeuroPath maintenance patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[maint-patch]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation batch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def patch(path, replacements):
              p = root / path
              text = p.read_text()
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected anchor not found in {path}: {old[:120]!r}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(text)

          # 1) Finish state/province routing at both OER tutor call sites and
          # make the local Gemma path consume the same personalization profile.
          vm = root / 'app/src/main/java/com/example/ui/NeuroPathViewModel.kt'
          text = vm.read_text()
          old = '''                    studentSubject = _selectedSubject.value,\n                    schoolDistrict = profile.schoolDistrict,\n                    country = profile.country\n                )'''
          new = '''                    studentSubject = _selectedSubject.value,\n                    schoolDistrict = profile.schoolDistrict,\n                    stateOrProvince = profile.stateOrProvince,\n                    country = profile.country\n                )'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected exactly 2 OER call sites, found {text.count(old)}')
          text = text.replace(old, new)

          old = 'Learner profile accommodation considerations: ${profile.neurodivergentTypesCsv}.'
          new = 'Learner profile accommodation considerations: ${com.example.learning.LearnerPersonalizationEngine.buildAccommodationSummary(profile)}.'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one raw cloud diagnosis prompt usage')
          text = text.replace(old, new)

          old = '''                        $basePrompt\n                        Theme world: ${theme.title} (${theme.buddyRole}).\n                        Active Subject Focus: ${currentSubject.title} (${currentSubject.id}).'''
          new = '''                        $basePrompt\n                        $personalizationProfile\n                        Theme world: ${theme.title} (${theme.buddyRole}).\n                        Active Subject Focus: ${currentSubject.title} (${currentSubject.id}).'''
          if old not in text:
              raise SystemExit('Local Gemma prompt anchor not found')
          text = text.replace(old, new, 1)

          # 2) Replace the fake offline curriculum delay with real local sync.
          old = '''    fun initiateOfflineCurriculumSync() {\n        if (_isDownloadingCurriculum.value) return\n        _isDownloadingCurriculum.value = true\n        viewModelScope.launch {\n            delay(15000)\n            _isDownloadingCurriculum.value = false\n        }\n    }'''
          new = '''    fun initiateOfflineCurriculumSync() {\n        if (_isDownloadingCurriculum.value) return\n        _isDownloadingCurriculum.value = true\n        viewModelScope.launch {\n            try {\n                val profile = _currentProfile.value\n                val units = repository.initializeOerCurriculum()\n                val resolution = com.example.data.curriculum.CurriculumResolver.resolve(\n                    country = profile.country,\n                    stateOrProvince = profile.stateOrProvince,\n                    schoolDistrict = profile.schoolDistrict,\n                    stageOrGrade = profile.gradeLevel,\n                    subject = _selectedSubject.value.title\n                )\n                val metadata = """\n                    {\n                      "source": "${resolution.educationAuthority}",\n                      "officialSourceUrl": "${resolution.officialSourceUrl}",\n                      "jurisdictionId": "${resolution.jurisdictionId ?: ""}",\n                      "stageOrGrade": "${profile.gradeLevel}",\n                      "subject": "${_selectedSubject.value.title}",\n                      "oerUnitsCached": ${units.size},\n                      "syncedAt": ${System.currentTimeMillis()}\n                    }\n                """.trimIndent()\n                repository.saveDownloadedCurriculum(\n                    com.example.data.local.entity.DownloadedCurriculumEntity(\n                        id = "curriculum_${profile.id}_${resolution.jurisdictionId ?: "routing"}",\n                        country = profile.country,\n                        stateOrProvince = profile.stateOrProvince,\n                        schoolDistrict = profile.schoolDistrict,\n                        postalCode = profile.zipOrPostalCodeOverride,\n                        standardTitle = resolution.stageOrGrade + " / " + resolution.subject,\n                        officialSourceAgency = resolution.educationAuthority,\n                        officialSourceUrl = resolution.officialSourceUrl,\n                        gradesCoveredSummary = profile.gradeLevel,\n                        rawCurriculumJson = metadata,\n                        lastSyncTimestamp = System.currentTimeMillis(),\n                        lastSyncDateFormatted = java.text.SimpleDateFormat("yyyy-MM-dd", java.util.Locale.US).format(java.util.Date()),\n                        syncStatus = "UP_TO_DATE"\n                    )\n                )\n            } catch (e: Exception) {\n                Log.w("NeuroPathViewModel", "Offline curriculum sync failed; retained existing cache", e)\n            } finally {\n                _isDownloadingCurriculum.value = false\n            }\n        }\n    }'''
          if old not in text:
              raise SystemExit('Offline sync block anchor not found')
          text = text.replace(old, new, 1)

          # 3) Record durable topic mastery alongside existing adaptive signals.
          old = 'com.example.learning.LearnerPersonalizationEngine.recordAnswer(getApplication(), _currentProfile.value.id, _selectedSubject.value.name, isCorrect, question.questionText.take(100))'
          new = '''com.example.learning.LearnerPersonalizationEngine.recordAnswer(getApplication(), _currentProfile.value.id, _selectedSubject.value.name, isCorrect, question.questionText.take(100))\n        com.example.learning.MasteryRepository.record(getApplication(), _currentProfile.value.id, _selectedSubject.value.name, question.questionText.take(100), isCorrect)'''
          if old not in text:
              raise SystemExit('Answer recording anchor not found')
          text = text.replace(old, new, 1)

          # 4) Prefer a real LiteRT-LM accelerated local model when installed;
          # otherwise preserve the existing GGUF/llama.cpp path unchanged.
          old = '''                    GemmaLocalManager.generateGemmaResponse(\n                        context = getApplication(),'''
          new = '''                    com.example.network.LiteRtGemmaManager.generateResponse(\n                        context = getApplication(),\n                        prompt = userText,\n                        systemPrompt = systemPrompt,\n                        maxTokens = 384\n                    ) ?: GemmaLocalManager.generateGemmaResponse(\n                        context = getApplication(),'''
          if old not in text:
              raise SystemExit('Gemma local generation anchor not found')
          text = text.replace(old, new, 1)
          vm.write_text(text)

          # 5) Privacy-safe accommodation summary used by cloud prompt construction.
          lp = root / 'app/src/main/java/com/example/learning/LearnerPersonalizationEngine.kt'
          text = lp.read_text()
          anchor = '''    fun recordAnswer(context: Context, profileId: Long, subject: String, correct: Boolean, topic: String? = null) {'''
          addition = '''    /**\n     * Cloud-safe accommodation summary. Deliberately excludes diagnosis/condition labels.\n     */\n    fun buildAccommodationSummary(profile: ChildProfileEntity): String {\n        val accommodations = mutableListOf<String>()\n        if (profile.dyslexiaFontEnabled) accommodations += "dyslexia-friendly typography"\n        if (profile.highContrastMode == "HIGH_CONTRAST") accommodations += "high-contrast presentation"\n        if (profile.readAnswersAloud) accommodations += "read-aloud support"\n        if (profile.autoHighlightWords) accommodations += "word highlighting"\n        csv(profile.strugglesCsv).take(4).forEach { accommodations += "learning support for $it" }\n        return accommodations.distinct().ifEmpty { listOf("Use clear, accessible, step-by-step explanations and check understanding frequently.") }.joinToString("; ")\n    }\n\n'''
          if anchor not in text:
              raise SystemExit('Learner personalization insertion anchor not found')
          text = text.replace(anchor, addition + anchor, 1)
          lp.write_text(text)

          # 6) Add durable mastery repository.
          mastery = root / 'app/src/main/java/com/example/learning/MasteryRepository.kt'
          mastery.parent.mkdir(parents=True, exist_ok=True)
          mastery.write_text('''package com.example.learning\n\nimport android.content.Context\nimport org.json.JSONArray\nimport org.json.JSONObject\nimport java.util.Locale\n\ndata class TopicMastery(\n    val topic: String,\n    val attempts: Int,\n    val correct: Int,\n    val streak: Int,\n    val masteryPercent: Int,\n    val lastUpdated: Long\n)\n\n/** Durable, on-device instructional telemetry. No cloud sync is performed here. */\nobject MasteryRepository {\n    private const val PREFS = "learner_mastery_v2"\n    private const val PROFILE_PREFIX = "profile_"\n\n    fun record(context: Context, profileId: Long, subject: String, topic: String, correct: Boolean, now: Long = System.currentTimeMillis()) {\n        val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)\n        val key = PROFILE_PREFIX + profileId\n        val root = runCatching { JSONObject(prefs.getString(key, "{}") ?: "{}") }.getOrDefault(JSONObject())\n        val subjectKey = subject.trim().uppercase(Locale.US).ifBlank { "GENERAL" }\n        val topicKey = topic.trim().ifBlank { "GENERAL" }\n        val subjects = root.optJSONObject(subjectKey) ?: JSONObject().also { root.put(subjectKey, it) }\n        val current = subjects.optJSONObject(topicKey) ?: JSONObject()\n        val attempts = current.optInt("attempts", 0) + 1\n        val correctCount = current.optInt("correct", 0) + if (correct) 1 else 0\n        val streak = if (correct) current.optInt("streak", 0) + 1 else 0\n        val accuracy = ((correctCount.toDouble() / attempts.toDouble()) * 70.0).toInt()\n        val streakScore = (streak * 5).coerceAtMost(30)\n        current.put("attempts", attempts).put("correct", correctCount).put("streak", streak)\n            .put("masteryPercent", (accuracy + streakScore).coerceIn(0, 100)).put("lastUpdated", now)\n        subjects.put(topicKey, current)\n        prefs.edit().putString(key, root.toString()).apply()\n    }\n\n    fun snapshot(context: Context, profileId: Long): List<TopicMastery> {\n        val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)\n        val root = runCatching { JSONObject(prefs.getString(PROFILE_PREFIX + profileId, "{}") ?: "{}") }.getOrDefault(JSONObject())\n        val result = mutableListOf<TopicMastery>()\n        root.keys().forEach { subject ->\n            val topics = root.optJSONObject(subject) ?: return@forEach\n            topics.keys().forEach { topic ->\n                val item = topics.optJSONObject(topic) ?: return@forEach\n                result += TopicMastery(topic, item.optInt("attempts"), item.optInt("correct"), item.optInt("streak"), item.optInt("masteryPercent"), item.optLong("lastUpdated"))\n            }\n        }\n        return result.sortedByDescending { it.lastUpdated }\n    }\n\n    fun overallMastery(context: Context, profileId: Long): Int = snapshot(context, profileId).let { items ->\n        if (items.isEmpty()) 0 else items.map { it.masteryPercent }.average().toInt()\n    }\n}\n''')

          # 7) Hardware capability + real LiteRT-LM accelerator path.
          hw = root / 'app/src/main/java/com/example/network/LocalAiHardwareManager.kt'
          hw.write_text('''package com.example.network\n\nimport android.app.ActivityManager\nimport android.content.Context\nimport android.os.Build\nimport java.io.File\n\nenum class LocalAiBackend { NPU, GPU, CPU, CLOUD, UNAVAILABLE }\n\ndata class LocalAiHardwareCapabilities(\n    val socManufacturer: String,\n    val socModel: String,\n    val totalRamGb: Float,\n    val arm64: Boolean,\n    val potentialNpuModel: String?,\n    val gpuModelAvailable: Boolean,\n    val summary: String\n)\n\nobject LocalAiHardwareManager {\n    private const val LITERT_MODEL_DIR = "models/litert"\n\n    fun inspect(context: Context): LocalAiHardwareCapabilities {\n        val memory = ActivityManager.MemoryInfo()\n        (context.getSystemService(Context.ACTIVITY_SERVICE) as? ActivityManager)?.getMemoryInfo(memory)\n        val ram = memory.totalMem / (1024f * 1024f * 1024f)\n        val arm64 = Build.SUPPORTED_ABIS.any { it == "arm64-v8a" }\n        val npu = npuModelName(Build.SOC_MANUFACTURER, Build.SOC_MODEL)\n        val gpu = genericGpuModelFile(context).exists()\n        val summary = when {\n            npu != null -> "NPU-capable LiteRT model target detected for ${Build.SOC_MANUFACTURER} ${Build.SOC_MODEL}; activation still requires successful LiteRT-LM initialization."\n            gpu -> "Generic LiteRT-LM GPU model is installed; activation still requires successful GPU runtime initialization."\n            else -> "No accelerator-ready LiteRT model is installed; the existing GGUF/llama.cpp CPU path remains available."\n        }\n        return LocalAiHardwareCapabilities(Build.SOC_MANUFACTURER, Build.SOC_MODEL, ram, arm64, npu, gpu, summary)\n    }\n\n    fun modelDirectory(context: Context): File = File(context.filesDir, LITERT_MODEL_DIR).also { it.mkdirs() }\n\n    fun genericGpuModelFile(context: Context): File = File(modelDirectory(context), "gemma3-1b-it-int4.litertlm")\n\n    fun npuModelName(manufacturer: String, model: String): String? {\n        val m = model.lowercase()\n        return when {\n            manufacturer.equals("Qualcomm", true) && m.contains("sm8550") -> "Gemma3-1B-IT_q4_ekv1280_sm8550.litertlm"\n            manufacturer.equals("Qualcomm", true) && m.contains("sm8650") -> "Gemma3-1B-IT_q4_ekv1280_sm8650.litertlm"\n            manufacturer.equals("Qualcomm", true) && m.contains("sm8750") -> "Gemma3-1B-IT_q4_ekv1280_sm8750.litertlm"\n            manufacturer.equals("Qualcomm", true) && m.contains("sm8850") -> "Gemma3-1B-IT_q4_ekv1280_sm8850.litertlm"\n            manufacturer.equals("MediaTek", true) && m.contains("mt6989") -> "Gemma3-1B-IT_q4_ekv1280_mt6989.litertlm"\n            manufacturer.equals("MediaTek", true) && m.contains("mt6991") -> "Gemma3-1B-IT_q4_ekv1280_mt6991.litertlm"\n            manufacturer.equals("MediaTek", true) && m.contains("mt6993") -> "Gemma3-1B-IT_q4_ekv1280_mt6993.litertlm"\n            manufacturer.equals("Google", true) && m.contains("g5") -> "Gemma3-1B-IT_q8_ekv1280_Google_Tensor_G5.litertlm"\n            manufacturer.equals("Google", true) && m.contains("g6") -> "Gemma3-1B-IT_q8_ekv1280_Google_Tensor_G6.litertlm"\n            else -> null\n        }\n    }\n\n    fun orderedCandidates(context: Context, modelFile: File): List<LocalAiBackend> {\n        val name = modelFile.name.lowercase()\n        return if ("sm8550" in name || "sm8650" in name || "sm8750" in name || "sm8850" in name || "mt6989" in name || "mt6991" in name || "mt6993" in name || "tensor" in name) {\n            listOf(LocalAiBackend.NPU, LocalAiBackend.GPU, LocalAiBackend.CPU)\n        } else {\n            listOf(LocalAiBackend.GPU, LocalAiBackend.CPU)\n        }\n    }\n}\n''')

          lm = root / 'app/src/main/java/com/example/network/LiteRtGemmaManager.kt'
          lm.write_text('''package com.example.network\n\nimport android.content.Context\nimport android.util.Log\nimport com.google.ai.edge.litertlm.Backend\nimport com.google.ai.edge.litertlm.ConversationConfig\nimport com.google.ai.edge.litertlm.Engine\nimport com.google.ai.edge.litertlm.EngineConfig\nimport com.google.ai.edge.litertlm.ThinkingConfig\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext\nimport okhttp3.OkHttpClient\nimport okhttp3.Request\nimport java.io.File\nimport java.io.FileOutputStream\nimport java.util.concurrent.TimeUnit\n\ndata class LocalAiInferenceMetrics(\n    val backend: LocalAiBackend,\n    val model: String,\n    val modelLoadMs: Long,\n    val totalGenerationMs: Long,\n    val responseChars: Int\n)\n\nobject LiteRtGemmaManager {\n    private const val TAG = "LiteRtGemmaManager"\n    private const val HF_BASE = "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/"\n    private val client = OkHttpClient.Builder().connectTimeout(30, TimeUnit.SECONDS).readTimeout(10, TimeUnit.MINUTES).build()\n\n    @Volatile var lastMetrics: LocalAiInferenceMetrics? = null\n        private set\n\n    fun modelFile(context: Context): File {\n        val caps = LocalAiHardwareManager.inspect(context)\n        val npu = caps.potentialNpuModel\n        return if (npu != null) File(LocalAiHardwareManager.modelDirectory(context), npu)\n        else LocalAiHardwareManager.genericGpuModelFile(context)\n    }\n\n    suspend fun downloadAcceleratedModel(context: Context, hfToken: String): Result<File> = withContext(Dispatchers.IO) {\n        val token = hfToken.trim()\n        if (token.isBlank()) return@withContext Result.failure(IllegalArgumentException("A Hugging Face access token is required for the gated LiteRT Gemma model. Accept the Gemma license on Hugging Face first."))\n        val caps = LocalAiHardwareManager.inspect(context)\n        val filename = caps.potentialNpuModel ?: "gemma3-1b-it-int4.litertlm"\n        val target = File(LocalAiHardwareManager.modelDirectory(context), filename)\n        if (target.exists() && target.length() > 100_000_000L && isLiteRtModel(target)) return@withContext Result.success(target)\n        val temp = File(target.parentFile, target.name + ".tmp")\n        return@withContext runCatching {\n            temp.delete()\n            val request = Request.Builder().url(HF_BASE + filename + "?download=true").header("Authorization", "Bearer $token").header("User-Agent", "NeuroPath-Android/2.00.00").build()\n            client.newCall(request).execute().use { response ->\n                check(response.isSuccessful) { "LiteRT Gemma download failed: HTTP ${response.code}" }\n                val body = response.body ?: error("Empty LiteRT Gemma response")\n                body.byteStream().use { input -> FileOutputStream(temp).use { output -> input.copyTo(output, 256 * 1024); output.fd.sync() } }\n            }\n            check(isLiteRtModel(temp)) { "Downloaded LiteRT Gemma file is not a valid LITERTLM container" }\n            target.delete()\n            check(temp.renameTo(target)) { "Could not install LiteRT Gemma model" }\n            target\n        }\n    }\n\n    suspend fun generateResponse(context: Context, prompt: String, systemPrompt: String, maxTokens: Int): String? = withContext(Dispatchers.Default) {\n        val model = modelFile(context)\n        if (!model.exists() || !isLiteRtModel(model)) return@withContext null\n        var lastError: Throwable? = null\n        for (backend in LocalAiHardwareManager.orderedCandidates(context, model)) {\n            val start = System.nanoTime()\n            try {\n                val config = EngineConfig(\n                    modelPath = model.absolutePath,\n                    backend = when (backend) {\n                        LocalAiBackend.NPU -> Backend.NPU(context.applicationInfo.nativeLibraryDir)\n                        LocalAiBackend.GPU -> Backend.GPU()\n                        else -> Backend.CPU()\n                    },\n                    cacheDir = context.cacheDir.absolutePath\n                )\n                Engine(config).use { engine ->\n                    engine.initialize()\n                    val loaded = (System.nanoTime() - start) / 1_000_000L\n                    engine.createConversation(\n                        ConversationConfig(\n                            systemInstruction = com.google.ai.edge.litertlm.Contents.of(systemPrompt),\n                            maxOutputToken = maxTokens,\n                            thinkingConfig = ThinkingConfig(enableThinking = false)\n                        )\n                    ).use { conversation ->\n                        val generationStart = System.nanoTime()\n                        val reply = conversation.sendMessage(prompt).text.trim()\n                        val total = (System.nanoTime() - generationStart) / 1_000_000L\n                        lastMetrics = LocalAiInferenceMetrics(backend, model.name, loaded, total, reply.length)\n                        if (reply.isNotBlank()) return@withContext reply\n                    }\n                }\n            } catch (t: Throwable) {\n                lastError = t\n                Log.w(TAG, "LiteRT ${backend.name} initialization/inference failed; trying next backend", t)\n            }\n        }\n        Log.w(TAG, "No LiteRT backend succeeded", lastError)\n        null\n    }\n\n    private fun isLiteRtModel(file: File): Boolean = runCatching {\n        file.inputStream().use { input ->\n            val magic = ByteArray(8)\n            input.read(magic) == 8 && String(magic, Charsets.US_ASCII) == "LITERTLM"\n        }\n    }.getOrDefault(false)\n}\n''')

          # 8) Add LiteRT-LM dependency and GPU native-library declarations.
          lv = root / 'gradle/libs.versions.toml'
          text = lv.read_text()
          if 'litertLmAndroid' not in text:
              text = text.replace('llamaAndroid = "0.1.1"', 'llamaAndroid = "0.1.1"\nlitertLmAndroid = "0.16.1"')
              text = text.replace('llama-android = { group = "dev.ffmpegkit-maintained", name = "llama-android", version.ref = "llamaAndroid" }', 'llama-android = { group = "dev.ffmpegkit-maintained", name = "llama-android", version.ref = "llamaAndroid" }\nlitertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertLmAndroid" }')
          lv.write_text(text)

          gradle = root / 'app/build.gradle.kts'
          text = gradle.read_text()
          if 'implementation(libs.litertlm.android)' not in text:
              text = text.replace('implementation(libs.llama.android)', 'implementation(libs.llama.android)\n  implementation(libs.litertlm.android)')
          gradle.write_text(text)

          manifest = root / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text()
          if 'libOpenCL.so' not in text:
              text = text.replace('<application', '<application\n        <uses-native-library android:name="libvndksupport.so" android:required="false"/>\n        <uses-native-library android:name="libOpenCL.so" android:required="false"/>', 1)
          manifest.write_text(text)

          # 9) Add tests for hardware selection and mastery progression.
          test_dir = root / 'app/src/test/java/com/example/network'
          test_dir.mkdir(parents=True, exist_ok=True)
          (test_dir / 'LocalAiHardwareManagerTest.kt').write_text('''package com.example.network\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass LocalAiHardwareManagerTest {\n    @Test fun mapsKnownQualcommNpuModel() {\n        assertEquals("Gemma3-1B-IT_q4_ekv1280_sm8750.litertlm", LocalAiHardwareManager.npuModelName("Qualcomm", "SM8750"))\n    }\n\n    @Test fun rejectsUnknownSocInsteadOfClaimingNpu() {\n        assertEquals(null, LocalAiHardwareManager.npuModelName("Qualcomm", "UNKNOWN"))\n    }\n\n    @Test fun acceleratedModelOrdersNpuBeforeGpuAndCpu() {\n        val candidates = LocalAiHardwareManager.orderedCandidates(\n            context = throw UnsupportedOperationException("context not used for ordering"),\n            modelFile = java.io.File("Gemma3-1B-IT_q4_ekv1280_sm8750.litertlm")\n        )\n        assertEquals(listOf(LocalAiBackend.NPU, LocalAiBackend.GPU, LocalAiBackend.CPU), candidates)\n    }\n}\n''')

          mastery_test_dir = root / 'app/src/test/java/com/example/learning'
          mastery_test_dir.mkdir(parents=True, exist_ok=True)
          (mastery_test_dir / 'MasteryRepositoryFormulaTest.kt').write_text('''package com.example.learning\n\nimport org.junit.Assert.assertEquals\nimport org.junit.Test\n\nclass MasteryRepositoryFormulaTest {\n    @Test fun firstCorrectAnswerProvidesAccuracyAndStreakCredit() {\n        val accuracy = ((1.0 / 1.0) * 70.0).toInt()\n        val streakScore = (1 * 5).coerceAtMost(30)\n        assertEquals(75, accuracy + streakScore)\n    }\n\n    @Test fun repeatedWrongAnswerResetsStreakButRetainsAccuracyHistory() {\n        val attempts = 2\n        val correct = 1\n        val mastery = ((correct.toDouble() / attempts) * 70.0).toInt()\n        assertEquals(35, mastery)\n    }\n}\n''')

          print('Maintenance implementation batch applied successfully.')
          PY

      - name: Verify changed files
        run: |
          git diff --check
          test -s app/src/main/java/com/example/network/LiteRtGemmaManager.kt
          test -s app/src/main/java/com/example/network/LocalAiHardwareManager.kt
          grep -q 'stateOrProvince = profile.stateOrProvince' app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          grep -q 'buildAccommodationSummary' app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          grep -q 'LiteRtGemmaManager.generateResponse' app/src/main/java/com/example/ui/NeuroPathViewModel.kt

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app gradle/libs.versions.toml
          git diff --cached --check
          git commit -m "feat: add privacy-safe curriculum and accelerated local AI"
          git push origin main
