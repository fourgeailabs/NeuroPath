name: Android CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The release step publishes the debug APK to a GitHub Release.
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -di debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Run JVM Unit Tests
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee test.log

      - name: Run Static Analysis (Detekt)
        shell: bash
        run: |
          set -o pipefail
          gradle detekt --stacktrace --console=plain 2>&1 | tee detekt.log || true

      - name: Check Code Style (Kotlin Lint)
        shell: bash
        run: |
          set -o pipefail
          gradle ktlintCheck --stacktrace --console=plain 2>&1 | tee ktlint.log || true

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuropath-gradle-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload JVM test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuropath-jvm-test-log
          path: test.log
          if-no-files-found: ignore

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuropath-detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload Ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuropath-ktlint-report
          path: app/build/reports/ktlint/
          if-no-files-found: ignore

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neuropath-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Resolve release tag
        id: release_tag
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && success()
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release and Upload APK
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "NeuroPath Release ${{ steps.release_tag.outputs.tag }}"
          body_path: README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  instrumented-tests:
    name: Instrumented Tests (Emulator)
    # Linux runners provide KVM hardware acceleration for x86_64 emulator images.
    # macOS ARM runners cannot virtualize x86_64 guests (HVF: HV_UNSUPPORTED),
    # so the emulator never booted there.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -di debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Enable KVM for emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: gradle connectedDebugAndroidTest --stacktrace --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        # Advisory scan only: its Docker image mishandles the runner's JAVA_HOME, so it must
        # never gate the build. The report still uploads when the scan succeeds.
        continue-on-error: true
        with:
          project: 'NeuroPath'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --skipProvidedScope true
      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: ignore