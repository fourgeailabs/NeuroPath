name: Patch local Gemma personalization
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch tutoring context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt')
          s = p.read_text()

          duplicate = '''                        Theme world: ${theme.title} (${theme.buddyRole}).
                        Active Subject Focus: ${currentSubject.title} (${currentSubject.id}).
                        District context: ${profile.schoolDistrict} in ${profile.city}, ${profile.stateOrProvince}, ${profile.country}.
                    """.trimIndent()'''
          if duplicate in s:
              s = s.replace(duplicate, '                    """.trimIndent()', 1)

          live_marker = 'fun sendLiveVoiceTurn(userVoiceWav: ByteArray? = null, userText: String? = null) {'
          live_start = s.find(live_marker)
          live_end = s.find('// Lyria Music Generation', live_start)
          if live_start < 0 or live_end < 0:
              raise SystemExit('live voice function not found')
          live = s[live_start:live_end]
          if 'Accommodations: ${profile.neurodivergentTypesCsv}' in live:
              live = live.replace('                Accommodations: ${profile.neurodivergentTypesCsv}.', '                $personalizationProfile', 1)
          if '$personalizationProfile' not in live:
              needle = '            val basePrompt = getSystemPromptForProfile(profile, roleContext = "tutor")\n'
              if needle not in live:
                  raise SystemExit('live voice base prompt not found')
              live = live.replace(needle, needle + '            val personalizationProfile = com.example.learning.LearnerPersonalizationEngine.buildPrompt(getApplication(), profile, _selectedSubjectTag.value.id, false)\n', 1)
              live = live.replace('                $basePrompt\n', '                $basePrompt\n                $personalizationProfile\n', 1)

          lines = live.splitlines()
          out = []
          added = False
          for line in lines:
              out.append(line)
              if line.strip() == 'country = profile.country' and not added:
                  out[-1] = line + ','
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + 'stateOrProvince = profile.stateOrProvince')
                  added = True
          if not added:
              raise SystemExit('live OER lookup country line not found')
          live = '\n'.join(out) + ('\n' if live.endswith('\n') else '')
          s = s[:live_start] + live + s[live_end:]
          p.write_text(s)
          PY
      - name: Verify tutoring context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt').read_text()
          live_start = s.find('fun sendLiveVoiceTurn(userVoiceWav: ByteArray? = null, userText: String? = null) {')
          live_end = s.find('// Lyria Music Generation', live_start)
          live = s[live_start:live_end]
          assert 'Accommodations: ${profile.neurodivergentTypesCsv}' not in live
          assert '$personalizationProfile' in live
          assert 'stateOrProvince = profile.stateOrProvince' in live
          chat_start = s.find('if (currentModel == ChatModelMode.GEMMA_LOCAL) {')
          chat_end = s.find('} else if (currentModel != ChatModelMode.OFFLINE)', chat_start)
          chat = s[chat_start:chat_end]
          assert '$personalizationProfile' in chat
          assert chat.count('Theme world: ${theme.title} (${theme.buddyRole}).') == 1
          assert chat.count('Active Subject Focus: ${currentSubject.title} (${currentSubject.id}).') == 1
          print('Scoped tutoring privacy, personalization, and jurisdiction checks passed.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'fix: harden live voice privacy and OER jurisdiction'
            git push
          fi
