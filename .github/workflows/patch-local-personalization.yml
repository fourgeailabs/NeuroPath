name: Patch local Gemma personalization
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch live OER jurisdiction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt')
          s = p.read_text()
          live_marker = 'fun sendLiveVoiceTurn(userVoiceWav: ByteArray? = null, userText: String? = null) {'
          live_start = s.find(live_marker)
          live_end = s.find('// Lyria Music Generation', live_start)
          if live_start < 0 or live_end < 0:
              raise SystemExit('live voice function not found')
          live = s[live_start:live_end]
          old = '''                schoolDistrict = profile.schoolDistrict,
                country = profile.country
            )
            val currContext ='''
          new = '''                schoolDistrict = profile.schoolDistrict,
                country = profile.country,
                stateOrProvince = profile.stateOrProvince
            )
            val currContext ='''
          if old not in live:
              raise SystemExit('live OER lookup target not found')
          live = live.replace(old, new, 1)
          s = s[:live_start] + live + s[live_end:]
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt').read_text()
          live_start = s.find('fun sendLiveVoiceTurn(userVoiceWav: ByteArray? = null, userText: String? = null) {')
          live_end = s.find('// Lyria Music Generation', live_start)
          live = s[live_start:live_end]
          assert 'schoolDistrict = profile.schoolDistrict,\n                country = profile.country,\n                stateOrProvince = profile.stateOrProvince' in live
          assert 'val personalizationProfile = com.example.learning.LearnerPersonalizationEngine.buildPrompt' in live
          assert 'Accommodations: ${profile.neurodivergentTypesCsv}' not in live
          print('Live voice OER jurisdiction and privacy checks passed.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'fix: pass subnational jurisdiction to live OER tutor'
            git push
          fi
