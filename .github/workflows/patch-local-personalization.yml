name: Patch local Gemma personalization
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch local Gemma prompt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt')
          s = p.read_text()
          pattern = re.compile(r'''(?P<indent>\s+)val systemPrompt = """\n(?P=indent)    \$basePrompt\n(?P=indent)    Theme world: \$\{theme\.title\} \(\$\{theme\.buddyRole\}\)\.\n(?P=indent)    Active Subject Focus: \$\{currentSubject\.title\} \(\$\{currentSubject\.id\}\)\.\n(?P=indent)    District context: \$\{profile\.schoolDistrict\} in \$\{profile\.city\}, \$\{profile\.stateOrProvince\}, \$\{profile\.country\}\.\n(?P=indent)"""\.trimIndent\(\)''')
          replacement = '''{indent}val systemPrompt = """
{indent}    $basePrompt
{indent}    $personalizationProfile
{indent}    Theme world: ${{theme.title}} (${{theme.buddyRole}}).
{indent}    Active Subject Focus: ${{currentSubject.title}} (${{currentSubject.id}}).
{indent}    Personalized Explanation Style: ${{currentMode.title}}
{indent}    Style Directive: ${{currentMode.promptDirective}}
{indent}    District context: ${{profile.schoolDistrict}} in ${{profile.city}}, ${{profile.stateOrProvince}}, ${{profile.country}}.
{indent}    Curriculum Framework: ${{profile.stateStandard}} (${{profile.schoolDistrict}}).

{indent}    Local Tutoring Rules:
{indent}    1. Adapt to the learner profile and observed mastery above; never treat a diagnosis as an identity label.
{indent}    2. Prefer the learner's recorded explanation style, but change strategy when it is not working.
{indent}    3. Use strengths and interests to make difficult ideas concrete.
{indent}    4. Keep accessibility and accommodation signals in mind without diagnosing or inferring conditions.
{indent}    5. Ground teaching in the supplied curriculum context when relevant.
{indent}    6. Preserve learner agency and use a Socratic approach rather than doing assessed work for the learner.
{indent}""".trimIndent()'''
          matches = list(pattern.finditer(s))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one local Gemma prompt block, found {len(matches)}')
          m = matches[0]
          p.write_text(s[:m.start()] + replacement.format(indent=m.group('indent')) + s[m.end():])
          PY
      - name: Verify patch
        run: |
          grep -F '$personalizationProfile' app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          test "$(grep -F -c 'Local Tutoring Rules:' app/src/main/java/com/example/ui/NeuroPathViewModel.kt)" -eq 1
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'fix: feed privacy-safe personalization into local Gemma'
            git push
          fi
