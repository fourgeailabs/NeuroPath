name: Patch local Gemma personalization
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch live OER jurisdiction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt')
          s = p.read_text()
          marker = 'fun sendLiveVoiceTurn(userVoiceWav: ByteArray? = null, userText: String? = null) {'
          start = s.find(marker)
          end = s.find('// Lyria Music Generation', start)
          if start < 0 or end < 0:
              raise SystemExit('live voice function not found')
          live = s[start:end]
          pattern = re.compile(r'(schoolDistrict\s*=\s*profile\.schoolDistrict,\s*\n\s*country\s*=\s*profile\.country)(\s*\n\s*\))')
          replacement = r'\1,\n                stateOrProvince = profile.stateOrProvince\2'
          live, count = pattern.subn(replacement, live, count=1)
          if count != 1:
              raise SystemExit('live OER jurisdiction target not found')
          s = s[:start] + live + s[end:]
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt').read_text()
          start = s.find('fun sendLiveVoiceTurn(userVoiceWav: ByteArray? = null, userText: String? = null) {')
          end = s.find('// Lyria Music Generation', start)
          live = s[start:end]
          assert 'stateOrProvince = profile.stateOrProvince' in live
          assert 'val personalizationProfile = com.example.learning.LearnerPersonalizationEngine.buildPrompt' in live
          assert 'Accommodations: ${profile.neurodivergentTypesCsv}' not in live
          print('Live voice OER jurisdiction and privacy checks passed.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'fix: pass subnational jurisdiction to live OER tutor'
            git push
          fi
