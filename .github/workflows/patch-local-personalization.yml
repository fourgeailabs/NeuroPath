name: Patch local Gemma personalization
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch tutoring context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt')
          s = p.read_text()

          marker = 'if (currentModel == ChatModelMode.GEMMA_LOCAL) {'
          start = s.find(marker)
          end = s.find('} else if (currentModel != ChatModelMode.OFFLINE)', start)
          if start < 0 or end < 0:
              raise SystemExit('local Gemma branch not found')
          block = s[start:end]
          duplicate = '''                        Theme world: ${theme.title} (${theme.buddyRole}).
                        Active Subject Focus: ${currentSubject.title} (${currentSubject.id}).
                        District context: ${profile.schoolDistrict} in ${profile.city}, ${profile.stateOrProvince}, ${profile.country}.
                    """.trimIndent()'''
          if duplicate in block:
              block = block.replace(duplicate, '                    """.trimIndent()', 1)
          if '$personalizationProfile' not in block:
              raise SystemExit('local personalization missing after prior patch')
          s = s[:start] + block + s[end:]

          # Ensure every tutor OER retrieval carries the selected subnational jurisdiction.
          target = '''schoolDistrict = profile.schoolDistrict,
                    country = profile.country'''
          replacement = '''schoolDistrict = profile.schoolDistrict,
                    country = profile.country,
                    stateOrProvince = profile.stateOrProvince'''
          if target in s:
              s = s.replace(target, replacement)
          p.write_text(s)
          PY
      - name: Verify tutoring context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt').read_text()
          start = s.find('if (currentModel == ChatModelMode.GEMMA_LOCAL) {')
          end = s.find('} else if (currentModel != ChatModelMode.OFFLINE)', start)
          block = s[start:end]
          assert '$personalizationProfile' in block
          assert block.count('Theme world: ${theme.title} (${theme.buddyRole}).') == 1
          assert block.count('Active Subject Focus: ${currentSubject.title} (${currentSubject.id}).') == 1
          assert 'Local Tutoring Rules:' in block
          assert 'stateOrProvince = profile.stateOrProvince' in s
          print('Local personalization and OER jurisdiction propagation verified.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/NeuroPathViewModel.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'fix: clean local tutoring context and pass OER jurisdiction'
            git push
          fi
