name: Maintenance - runtime and OER audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch OER jurisdiction routing and hardware claims
        shell: python
        run: |
          from pathlib import Path
          vm = Path('app/src/main/java/com/example/ui/NeuroPathViewModel.kt')
          s = vm.read_text()
          old = '                    country = profile.country\n                )'
          new = '                    country = profile.country,\n                    stateOrProvince = profile.stateOrProvince\n                )'
          count = s.count(old)
          if count == 0:
              raise SystemExit('No profile-based OER tutor call missing stateOrProvince was found')
          s = s.replace(old, new)
          vm.write_text(s)
          hw = Path('app/src/main/java/com/example/network/LocalAiHardwareManager.kt')
          h = hw.read_text()
          unsupported = '            manufacturer.equals("Samsung", true) && model.contains("exynos") -> "SAMSUNG_EXYNOS"\n'
          if unsupported not in h:
              raise SystemExit('Expected unsupported Samsung NPU claim was not found')
          hw.write_text(h.replace(unsupported, ''))
          print(f'Patched {count} OER tutor call(s) and removed unsupported Exynos NPU claim')
      - name: Verify source invariants
        shell: bash
        run: |
          ! grep -n 'manufacturer.equals("Samsung", true) && model.contains("exynos")' app/src/main/java/com/example/network/LocalAiHardwareManager.kt
          if grep -n -A8 'retrieveOerTutorContext(' app/src/main/java/com/example/ui/NeuroPathViewModel.kt | grep -B8 -A8 'country = profile.country' | grep -q 'stateOrProvince = profile.stateOrProvince'; then true; fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build and test
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --console=plain
          gradle testDebugUnitTest --stacktrace --console=plain
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/NeuroPathViewModel.kt app/src/main/java/com/example/network/LocalAiHardwareManager.kt
          git commit -m 'fix: route OER by region and keep accelerator claims truthful'
          git push
      - name: Remove maintenance workflow
        shell: bash
        run: |
          git rm .github/workflows/maintenance-runtime-audit.yml
          git commit -m 'chore: remove one-time runtime audit workflow'
          git push
